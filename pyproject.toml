[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celeba-gan-lab"
version = "0.1.0"
description = "CelebA face generation laboratory with DCGAN and conditional DCGAN."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "facenet-pytorch>=2.6.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scipy>=1.12.0",
  "Pillow>=10.0.0",
  "matplotlib>=3.8.0",
  "PyYAML>=6.0.1",
  "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["src"]
